    <script>
      // Ignore disabled Vite HMR WebSocket closing errors per AI Studio environment constraints
      window.addEventListener('error', function (e) {
        if (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('closed without opened') !== -1)) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var str = (e.reason && (e.reason.message || e.reason.stack || '')) + '';
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('closed without opened') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return true;
        }
      }, true);
    </script>
